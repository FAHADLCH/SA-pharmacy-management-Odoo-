services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8073:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo
      # Mount the Odoo 18 module variant as a custom addon.
      - "../sa_pharmacy_management:/mnt/extra-addons/sa_pharmacy_management:ro"
      - "./odoo.conf:/etc/odoo/odoo.conf:ro"
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]

volumes:
  odoo-db:
  odoo-data:
