[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; ---------------------------------------------------------------------------
; SECURITY: change this master password before going live. It guards database
; create/drop/backup operations. Use a long random string.
; ---------------------------------------------------------------------------
admin_passwd = CHANGE-ME-master-password

db_host = db
db_port = 5432
db_user = odoo
; Must match POSTGRES_PASSWORD in .env
db_password = change-me-strong-password

; Hide the database manager / selector in production.
list_db = False

; Run behind a reverse proxy (nginx/traefik) that terminates TLS.
proxy_mode = True

; Multi-process tuning. Rule of thumb: workers = (CPU cores * 2) + 1.
; Set to 0 to keep the single-process (threaded) server for small sites.
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 8192
