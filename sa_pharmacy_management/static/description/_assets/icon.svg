<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2026"/>
      <stop offset="0.55" stop-color="#14181d"/>
      <stop offset="1" stop-color="#2a0e10"/>
    </linearGradient>
    <linearGradient id="cross" x1="150" y1="150" x2="380" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b41"/>
      <stop offset="1" stop-color="#cf1d23"/>
    </linearGradient>
    <linearGradient id="cap" x1="300" y1="180" x2="380" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#E8242A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8242A" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <path d="M256 16C120 16 56 16 36 96 16 176 16 336 36 416 56 496 120 496 256 496 392 496 456 496 476 416 496 336 496 176 476 96 456 16 392 16 256 16Z" fill="url(#bg)"/>
  <path d="M256 16C120 16 56 16 36 96 16 176 16 336 36 416 56 496 120 496 256 496 392 496 456 496 476 416 496 336 496 176 476 96 456 16 392 16 256 16Z" fill="url(#glow)"/>

  <!-- subtle hexagon brand ring -->
  <path d="M256 92 L386 167 L386 317 L256 392 L126 317 L126 167 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="14"/>

  <!-- pharmacy cross -->
  <g filter="url(#ds)">
    <path d="M214 150 H298 A18 18 0 0 1 316 168 V214 H362 A18 18 0 0 1 380 232 V280 A18 18 0 0 1 362 298 H316 V344 A18 18 0 0 1 298 362 H214 A18 18 0 0 1 196 344 V298 H150 A18 18 0 0 1 132 280 V232 A18 18 0 0 1 150 214 H196 V168 A18 18 0 0 1 214 150 Z" fill="url(#cross)"/>
  </g>

  <!-- capsule pill overlay -->
  <g transform="rotate(40 256 256)">
    <rect x="232" y="150" width="48" height="212" rx="24" fill="url(#cap)"/>
    <rect x="232" y="150" width="48" height="106" rx="24" fill="#ff6b6f" fill-opacity="0.92"/>
    <rect x="232" y="248" width="48" height="16" fill="#14181d" fill-opacity="0.12"/>
  </g>
</svg>
